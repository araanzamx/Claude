<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sección CTA – IBERO Egresados</title>
  <style>
    body { background-color: #f4f0ec; margin: 0; padding: 30px; font-family: Arial, Helvetica, sans-serif; }
    table, td { border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { border: 0; display: block; }
    @media only screen and (max-width: 620px) {
      .email-container { width: 100% !important; }
      .col-half { display: block !important; width: 100% !important; margin-bottom: 16px; }
      .spacer-col { display: none !important; }
    }
  </style>
</head>
<body>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td align="center">

      <table class="email-container" role="presentation" width="600" cellpadding="0"
             cellspacing="0" border="0" style="max-width:600px; width:100%; background:#ffffff;">

        <!-- ================================================ -->
        <!--  SECCIÓN CTA  –  Dos recuadros con botones       -->
        <!-- ================================================ -->
        <tr>
          <td bgcolor="#ffffff"
              style="background-color: #ffffff; padding: 16px 28px 20px 28px;">

            <!-- Contenedor centrado de ancho reducido -->
            <table role="presentation" align="center" width="420" cellpadding="0" cellspacing="0" border="0"
                   style="max-width: 420px; width: 100%; margin: 0 auto;">
              <tr>

                <!-- ---- CAJA 1: Actualizar información ---- -->
                <td class="col-half" valign="top" width="48%"
                    style="background-color: #ffffff;
                           border-top: 2px solid #d10023;
                           border-right: 1px solid #e0e0e0;
                           border-bottom: 1px solid #e0e0e0;
                           border-left: 1px solid #e0e0e0;
                           text-align: center;">

                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">

                    <!-- Ícono -->
                    <tr>
                      <td align="center" style="padding: 16px 12px 8px 12px;">
                        <img src="https://image.contactoibero.mx/lib/fe3811727364047c711475/m/1/d25ffce8-a3da-45f5-a656-daebca1fa078.png"
                             alt="Comunidad IBERO"
                             width="72"
                             style="width: 72px; height: auto;" />
                      </td>
                    </tr>

                    <!-- Texto -->
                    <tr>
                      <td align="center" valign="top" height="40"
                          style="height: 40px; vertical-align: top; padding: 0 10px;">
                        <p style="font-family: Arial, Helvetica, sans-serif;
                                  font-size: 13px;
                                  color: #444444;
                                  line-height: 1.4;
                                  margin: 0;">
                          Sigamos en contacto
                        </p>
                      </td>
                    </tr>

                    <!-- Botón -->
                    <tr>
                      <td align="center" style="padding: 10px 10px 16px 10px;">
                        <table role="presentation" align="center" cellpadding="0" cellspacing="0" border="0">
                          <tr>
                            <td bgcolor="#d10023"
                                style="background-color: #d10023; border-radius: 3px;">
                              <a href="https://portalegresados.ibero.mx/auth/login"
                                 target="_blank"
                                 style="display: inline-block;
                                        font-family: Arial, Helvetica, sans-serif;
                                        font-size: 11px;
                                        font-weight: bold;
                                        color: #ffffff;
                                        text-decoration: none;
                                        letter-spacing: 0.5px;
                                        white-space: nowrap;
                                        text-align: center;
                                        padding: 9px 10px;">
                                ACTUALIZAR INFORMACIÓN
                              </a>
                            </td>
                          </tr>
                        </table>
                      </td>
                    </tr>

                  </table>
                </td>

                <!-- Espacio entre cajas -->
                <td class="spacer-col" width="4%" style="font-size:0; line-height:0;">&nbsp;</td>

                <!-- ---- CAJA 2: Visita nuestro portal ---- -->
                <td class="col-half" valign="top" width="48%"
                    style="background-color: #ffffff;
                           border-top: 2px solid #d10023;
                           border-right: 1px solid #e0e0e0;
                           border-bottom: 1px solid #e0e0e0;
                           border-left: 1px solid #e0e0e0;
                           text-align: center;">

                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">

                    <!-- Ícono -->
                    <tr>
                      <td align="center" style="padding: 16px 12px 8px 12px;">
                        <img src="https://image.contactoibero.mx/lib/fe3811727364047c711475/m/1/d2d4abba-45f0-4a02-9ec8-efa971318f8e.png"
                             alt="Portal Egresados IBERO"
                             width="72"
                             style="width: 72px; height: auto;" />
                      </td>
                    </tr>

                    <!-- Texto -->
                    <tr>
                      <td align="center" valign="top" height="40"
                          style="height: 40px; vertical-align: top; padding: 0 10px;">
                        <p style="font-family: Arial, Helvetica, sans-serif;
                                  font-size: 13px;
                                  color: #444444;
                                  line-height: 1.4;
                                  margin: 0;">
                          Descubre actividades,<br />noticias y oportunidades
                        </p>
                      </td>
                    </tr>

                    <!-- Botón -->
                    <tr>
                      <td align="center" style="padding: 10px 10px 16px 10px;">
                        <table role="presentation" align="center" cellpadding="0" cellspacing="0" border="0">
                          <tr>
                            <td bgcolor="#d10023"
                                style="background-color: #d10023; border-radius: 3px;">
                              <a href="https://egresados.ibero.mx/"
                                 target="_blank"
                                 style="display: inline-block;
                                        font-family: Arial, Helvetica, sans-serif;
                                        font-size: 11px;
                                        font-weight: bold;
                                        color: #ffffff;
                                        text-decoration: none;
                                        letter-spacing: 0.5px;
                                        white-space: nowrap;
                                        text-align: center;
                                        padding: 9px 10px;">
                                VISITA NUESTRO PORTAL
                              </a>
                            </td>
                          </tr>
                        </table>
                      </td>
                    </tr>

                  </table>
                </td>

              </tr>
            </table>

          </td>
        </tr>
        <!-- FIN: Sección CTA -->

      </table>
    </td>
  </tr>
</table>

</body>
</html>
