<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sección CTA – IBERO Egresados</title>
  <style>
    body { background-color: #f4f0ec; margin: 0; padding: 30px; font-family: Arial, Helvetica, sans-serif; }
    table, td { border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { border: 0; display: block; }
    @media only screen and (max-width: 620px) {
      .email-container { width: 100% !important; }
      .col-half { display: block !important; width: 100% !important; margin-bottom: 16px; }
      .spacer-col { display: none !important; }
    }
  </style>
</head>
<body>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td align="center">

      <table class="email-container" role="presentation" width="600" cellpadding="0"
             cellspacing="0" border="0" style="max-width:600px; width:100%; background:#ffffff;">

        <!-- ================================================ -->
        <!--  SECCIÓN CTA  –  Dos recuadros con botones       -->
        <!-- ================================================ -->
        <tr>
          <td bgcolor="#ffffff"
              style="background-color: #ffffff; padding: 28px 28px 32px 28px;">

            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>

                <!-- ---- CAJA 1: Actualizar información ---- -->
                <td class="col-half" valign="top" width="48%"
                    style="background-color: #ffffff;
                           border-top: 2px solid #d10023;
                           border-right: 1px solid #e0e0e0;
                           border-bottom: 1px solid #e0e0e0;
                           border-left: 1px solid #e0e0e0;
                           text-align: center;">

                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">

                    <!-- Ícono -->
                    <tr>
                      <td align="center" style="padding: 24px 16px 12px 16px;">
                        <img src="https://image.contactoibero.mx/lib/fe3811727364047c711475/m/1/3b6b5f2c-3b18-45aa-a48e-47b9e16ee5df.png"
                             alt="Comunidad IBERO"
                             width="72"
                             style="width: 72px; height: auto;" />
                      </td>
                    </tr>

                    <!-- Texto -->
                    <tr>
                      <td align="center" valign="top"
                          style="padding: 0 16px 0 16px;">
                        <p style="font-family: Arial, Helvetica, sans-serif;
                                  font-size: 15px;
                                  color: #444444;
                                  line-height: 1.5;
                                  margin: 0;">
                          Sigamos en contacto
                        </p>
                      </td>
                    </tr>

                    <!-- Botón -->
                    <tr>
                      <td align="center" style="padding: 14px 16px 24px 16px;">
                        <table role="presentation" align="center" cellpadding="0" cellspacing="0" border="0">
                          <tr>
                            <td bgcolor="#d10023"
                                style="background-color: #d10023; border-radius: 3px;">
                              <a href="https://portalegresados.ibero.mx/auth/login"
                                 target="_blank"
                                 style="display: inline-block;
                                        font-family: Arial, Helvetica, sans-serif;
                                        font-size: 13px;
                                        font-weight: bold;
                                        color: #ffffff;
                                        text-decoration: none;
                                        letter-spacing: 0.8px;
                                        padding: 12px 20px;">
                                ACTUALIZAR INFORMACIÓN
                              </a>
                            </td>
                          </tr>
                        </table>
                      </td>
                    </tr>

                  </table>
                </td>

                <!-- Espacio entre cajas -->
                <td class="spacer-col" width="4%" style="font-size:0; line-height:0;">&nbsp;</td>

                <!-- ---- CAJA 2: Visita nuestro portal ---- -->
                <td class="col-half" valign="top" width="48%"
                    style="background-color: #ffffff;
                           border-top: 2px solid #d10023;
                           border-right: 1px solid #e0e0e0;
                           border-bottom: 1px solid #e0e0e0;
                           border-left: 1px solid #e0e0e0;
                           text-align: center;">

                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">

                    <!-- Ícono -->
                    <tr>
                      <td align="center" style="padding: 24px 16px 12px 16px;">
                        <img src="https://image.contactoibero.mx/lib/fe3811727364047c711475/m/1/25e07ab2-a070-4930-b1b5-46d6e454aac9.png"
                             alt="Portal Egresados IBERO"
                             width="72"
                             style="width: 72px; height: auto;" />
                      </td>
                    </tr>

                    <!-- Texto -->
                    <tr>
                      <td align="center" valign="top"
                          style="padding: 0 16px 0 16px;">
                        <p style="font-family: Arial, Helvetica, sans-serif;
                                  font-size: 15px;
                                  color: #444444;
                                  line-height: 1.5;
                                  margin: 0;">
                          Descubre actividades,<br />noticias y oportunidades
                        </p>
                      </td>
                    </tr>

                    <!-- Botón -->
                    <tr>
                      <td align="center" style="padding: 14px 16px 24px 16px;">
                        <table role="presentation" align="center" cellpadding="0" cellspacing="0" border="0">
                          <tr>
                            <td bgcolor="#d10023"
                                style="background-color: #d10023; border-radius: 3px;">
                              <a href="https://egresados.ibero.mx/"
                                 target="_blank"
                                 style="display: inline-block;
                                        font-family: Arial, Helvetica, sans-serif;
                                        font-size: 13px;
                                        font-weight: bold;
                                        color: #ffffff;
                                        text-decoration: none;
                                        letter-spacing: 0.8px;
                                        padding: 12px 20px;">
                                VISITA NUESTRO PORTAL
                              </a>
                            </td>
                          </tr>
                        </table>
                      </td>
                    </tr>

                  </table>
                </td>

              </tr>
            </table>

          </td>
        </tr>
        <!-- FIN: Sección CTA -->

      </table>
    </td>
  </tr>
</table>

</body>
</html>
