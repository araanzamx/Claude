<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ibero Egresados</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style type="text/css">
    /* Reset básico para clientes de correo */
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; }
    body { margin: 0; padding: 0; background-color: #f4f4f4; }

    /* Estilo para links */
    a { color: #8B0000; }

    /* Responsive para móviles */
    @media only screen and (max-width: 600px) {
      .email-wrapper { width: 100% !important; }
      .logo-ibero { width: 100px !important; }
      .logo-egresados { width: 120px !important; }
      .hero-image img { width: 100% !important; height: auto !important; }
      .icono-texto td { display: block !important; width: 100% !important; text-align: center !important; }
    }
  </style>
</head>

<body style="margin: 0; padding: 0; background-color: #f4f4f4;">

  <!-- ========================================================== -->
  <!-- TABLA CONTENEDOR PRINCIPAL (centrada, 600px de ancho)       -->
  <!-- ========================================================== -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
         style="background-color: #f4f4f4;">
    <tr>
      <td align="center" style="padding: 20px 10px;">

        <!-- Caja principal del correo -->
        <table class="email-wrapper" role="presentation" width="600" cellpadding="0"
               cellspacing="0" border="0"
               style="background-color: #ffffff; max-width: 600px; width: 100%;">


          <!-- ================================================ -->
          <!-- 1. CINTILLA ROJA: Logos Ibero y Egresados         -->
          <!-- ================================================ -->
          <tr>
            <td style="background-color: #8B0000; padding: 12px 20px;">

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>

                  <!-- Logo Ibero (izquierda) -->
                  <td align="left" valign="middle" style="padding: 0;">
                    <img class="logo-ibero"
                         src="https://image.contactoibero.mx/lib/fe3811727364047c711475/m/1/3ddfa8a0-f350-4380-9400-64f9d5629344.png"
                         alt="Universidad Iberoamericana"
                         width="120"
                         style="display: block; height: auto; max-width: 120px;" />
                  </td>

                  <!-- Logo Egresados (derecha) -->
                  <td align="right" valign="middle" style="padding: 0;">
                    <img class="logo-egresados"
                         src="https://image.contactoibero.mx/lib/fe3811727364047c711475/m/1/4ba04647-eace-4d94-bb4b-0d0a1e312552.png"
                         alt="Egresados Ibero"
                         width="140"
                         style="display: block; height: auto; max-width: 140px;" />
                  </td>

                </tr>
              </table>

            </td>
          </tr>
          <!-- FIN: Cintilla roja -->


          <!-- ================================================ -->
          <!-- 2. IMAGEN PRINCIPAL "NECESITO"                    -->
          <!-- ================================================ -->
          <tr>
            <td class="hero-image" align="center" style="padding: 0; line-height: 0;">
              <img src="https://image.contactoibero.mx/lib/fe3811727364047c711475/m/1/24ae7700-b7db-40b6-afbd-35f821c9de50.jpg"
                   alt="Necesito"
                   width="600"
                   style="display: block; width: 100%; max-width: 600px; height: auto;" />
            </td>
          </tr>
          <!-- FIN: Imagen principal -->


          <!-- ================================================ -->
          <!-- 3. SECCIÓN DE ICONOS / BENEFICIOS                 -->
          <!-- ================================================ -->
          <tr>
            <td style="background-color: #ffffff; padding: 30px 30px 20px 30px;">

              <!-- Subtítulo de la sección -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center"
                      style="font-family: Arial, Helvetica, sans-serif;
                             font-size: 18px;
                             font-weight: bold;
                             color: #8B0000;
                             padding-bottom: 20px;">
                    ¿Qué necesitas?
                  </td>
                </tr>
              </table>

              <!-- Fila de iconos -->
              <table class="icono-texto" role="presentation" width="100%"
                     cellpadding="0" cellspacing="0" border="0">
                <tr>

                  <!-- Icono 1: Comunidad / Personas -->
                  <td align="center" valign="top" width="50%"
                      style="padding: 10px 15px;">

                    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td align="center" style="padding-bottom: 10px;">
                          <!-- Imagen del ícono de personas -->
                          <img src="https://image.contactoibero.mx/lib/fe3811727364047c711475/m/1/3b6b5f2c-3b18-45aa-a48e-47b9e16ee5df.png"
                               alt="Comunidad de Egresados"
                               width="70"
                               style="display: block; width: 70px; height: auto; margin: 0 auto;" />
                        </td>
                      </tr>
                      <tr>
                        <td align="center"
                            style="font-family: Arial, Helvetica, sans-serif;
                                   font-size: 14px;
                                   color: #333333;
                                   line-height: 1.5;">
                          <!-- Texto descriptivo del ícono 1 -->
                          Conectarte con la<br />
                          <strong style="color: #8B0000;">Comunidad Ibero</strong>
                        </td>
                      </tr>
                    </table>

                  </td>
                  <!-- FIN: Icono 1 -->

                  <!-- Separador vertical (visible solo en desktop) -->
                  <td width="1" style="background-color: #dddddd;">&nbsp;</td>

                  <!-- Icono 2: Credencial -->
                  <td align="center" valign="top" width="50%"
                      style="padding: 10px 15px;">

                    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td align="center" style="padding-bottom: 10px;">
                          <!-- Imagen del ícono de credencial -->
                          <img src="https://image.contactoibero.mx/lib/fe3811727364047c711475/m/1/25e07ab2-a070-4930-b1b5-46d6e454aac9.png"
                               alt="Credencial de Egresado"
                               width="70"
                               style="display: block; width: 70px; height: auto; margin: 0 auto;" />
                        </td>
                      </tr>
                      <tr>
                        <td align="center"
                            style="font-family: Arial, Helvetica, sans-serif;
                                   font-size: 14px;
                                   color: #333333;
                                   line-height: 1.5;">
                          <!-- Texto descriptivo del ícono 2 -->
                          Obtener tu<br />
                          <strong style="color: #8B0000;">Credencial de Egresado</strong>
                        </td>
                      </tr>
                    </table>

                  </td>
                  <!-- FIN: Icono 2 -->

                </tr>
              </table>

            </td>
          </tr>
          <!-- FIN: Sección de iconos -->


          <!-- ================================================ -->
          <!-- 4. SEPARADOR                                       -->
          <!-- ================================================ -->
          <tr>
            <td style="padding: 0 30px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td height="1" style="background-color: #dddddd; font-size: 0; line-height: 0;">&nbsp;</td>
                </tr>
              </table>
            </td>
          </tr>
          <!-- FIN: Separador -->


          <!-- ================================================ -->
          <!-- 5. FIRMA                                           -->
          <!-- ================================================ -->
          <tr>
            <td align="center" style="padding: 25px 30px 30px 30px;">
              <img src="https://image.contactoibero.mx/lib/fe3811727364047c711475/m/1/52b55ff2-725a-44e9-a96f-34737f946eec.png"
                   alt="Firma - Dirección de Egresados Ibero"
                   width="300"
                   style="display: block; width: 100%; max-width: 300px; height: auto; margin: 0 auto;" />
            </td>
          </tr>
          <!-- FIN: Firma -->


          <!-- ================================================ -->
          <!-- 6. PIE DE PÁGINA / FOOTER                         -->
          <!-- ================================================ -->
          <tr>
            <td style="background-color: #8B0000; padding: 15px 20px;">

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <!-- Texto legal del footer -->
                  <td align="center"
                      style="font-family: Arial, Helvetica, sans-serif;
                             font-size: 11px;
                             color: #ffffff;
                             line-height: 1.6;">

                    Universidad Iberoamericana Ciudad de México<br />
                    Prolongación Paseo de la Reforma 880, Lomas de Santa Fe,<br />
                    C.P. 01219, Ciudad de México.<br /><br />

                    <!-- Enlace para cancelar suscripción (requerido por Marketing Cloud) -->
                    Si no deseas recibir más correos,
                    <a href="%%subscription_center_url%%"
                       style="color: #ffffff; text-decoration: underline;">
                      cancela tu suscripción aquí
                    </a>.

                  </td>
                </tr>
              </table>

            </td>
          </tr>
          <!-- FIN: Footer -->


        </table>
        <!-- FIN: Caja principal del correo -->

      </td>
    </tr>
  </table>
  <!-- FIN: Tabla contenedor principal -->

</body>
</html>
